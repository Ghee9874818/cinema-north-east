name: Feed and interface integrity review
on:
  push:
    branches:
      - test/alnwick-api-collector
    paths:
      - 'build_feed.py'
      - 'index.html'
      - 'tests/**'
      - 'additional_tests/**'
      - 'collect_additional.py'
      - '.github/workflows/integrity-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s additional_tests -v
      - name: Install browser test dependencies
        run: |
          npm install --prefix /tmp/cinema-ui-tests playwright@1.58.2
          /tmp/cinema-ui-tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser smoke tests
        env:
          NODE_PATH: /tmp/cinema-ui-tests/node_modules
        run: node tests/ui-smoke.cjs
      - name: Save mobile screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-ui-review
          path: ui-mobile-qa.png
          if-no-files-found: warn
          retention-days: 7
